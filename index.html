<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16324a" />
  <title>Chicken Drop</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/chicken.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <strong>CHICKEN DROP</strong>
      <span id="status">Tap the map to pick a building.</span>
    </header>
    <div id="map"></div>
    <aside class="dock">
      <button type="button" id="launch" class="primary">Launch chicken</button>
      <button type="button" id="street" disabled>Street View</button>
      <button type="button" id="earth" disabled>Google Earth</button>
    </aside>
    <section class="view" id="view" hidden>
      <header>
        <strong>Building view</strong>
        <button type="button" id="close-view">Close</button>
      </header>
      <p id="view-note">Opens the spot you hit. Google may ask you to allow the panorama.</p>
      <iframe id="frame" title="Street View" referrerpolicy="no-referrer"></iframe>
    </section>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/chicken.js"></script>
</body>
</html>
