<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080B0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Nuclear Atlas</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div class="brand">NUCLEAR ATLAS</div>
        <p class="tag">Educational effects model. Not a forecast.</p>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-learn">Learn</button>
        <button type="button" id="btn-sources">Sources</button>
      </div>
    </header>
    <div class="stage">
      <div id="map" role="application" aria-label="World map"></div>
      <div class="legend" id="legend"></div>
      <div class="layers" id="layers"></div>
      <div class="opacity">
        <label for="opacity">Layer opacity</label>
        <input id="opacity" type="range" min="0.25" max="0.9" step="0.01" value="0.72" />
      </div>
    </div>
    <aside class="dock" id="dock">
      <div class="scenarios" id="scenarios"></div>
      <div class="readout" id="readout">Choose a scenario, then tap the map.</div>
      <button type="button" class="primary" id="btn-sim">SIMULATE</button>
      <div class="row">
        <button type="button" id="btn-restart">Restart</button>
        <button type="button" id="btn-more">More</button>
      </div>
      <div class="more" id="more-panel">
        <div class="row" id="wind-row" hidden>
          <label>Wind
            <select id="wind-speed"><option value="15">15 mph</option><option value="30">30 mph</option></select>
          </label>
          <label>From
            <select id="wind-from">
              <option value="0">North</option>
              <option value="90">East</option>
              <option value="180">South</option>
              <option value="270" selected>West</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button type="button" id="btn-new">New scenario</button>
          <button type="button" id="btn-reset-view">Reset view</button>
        </div>
        <div class="row">
          <button type="button" id="btn-zoom-in">Zoom in</button>
          <button type="button" id="btn-zoom-out">Zoom out</button>
        </div>
        <div class="row">
          <button type="button" id="btn-legend">Legend</button>
          <button type="button" id="btn-opacity">Opacity</button>
        </div>
        <label>Compare with
          <select id="compare"><option value="">None</option></select>
        </label>
        <button type="button" id="btn-compare">Run comparison</button>
        <div class="row">
          <button type="button" id="btn-history">History</button>
          <button type="button" id="btn-export">Export</button>
          <button type="button" id="btn-import">Import</button>
          <input id="import-file" type="file" accept="application/json" hidden />
        </div>
        <div class="row timeline" id="timeline"></div>
        <p class="warn">Estimates are labelled. Missing data is left blank.</p>
      </div>
    </aside>
  </div>
  <section class="sheet" id="sheet" aria-live="polite">
    <header>
      <strong id="sheet-title">Results</strong>
      <button type="button" id="sheet-close">Close</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="sheet-body"></div>
  </section>
  <dialog class="modal" id="learn-dialog"></dialog>
  <dialog class="modal" id="source-dialog"></dialog>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/sources.js"></script>
  <script src="data/constants.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="data/countries.js"></script>
  <script src="models/geoMath.js"></script>
  <script src="models/blastModel.js"></script>
  <script src="models/thermalModel.js"></script>
  <script src="models/radiationModel.js"></script>
  <script src="models/falloutModel.js"></script>
  <script src="models/geographyModel.js"></script>
  <script src="models/populationImpactModel.js"></script>
  <script src="models/economicModel.js"></script>
  <script src="models/visualisationModel.js"></script>
  <script src="simulation/state.js"></script>
  <script src="simulation/engine.js"></script>
  <script src="map/mapView.js"></script>
  <script src="components/learn.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
