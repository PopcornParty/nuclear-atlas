<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102033" />
  <title>Chicken Drop</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/chicken.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <strong>CHICKEN DROP</strong>
      <span id="status">Tap a target. Time the launch.</span>
    </header>
    <div id="map"></div>
    <aside class="dock">
      <div class="stats" id="stats"></div>
      <div class="hit" id="hit">
        <p id="hit-text">No drop yet.</p>
        <div class="row">
          <button type="button" id="street" disabled>Street View</button>
          <button type="button" id="earth" disabled>Google Earth</button>
        </div>
      </div>
      <div class="row">
        <button type="button" id="launch" class="primary">Launch</button>
        <button type="button" id="reload">New round</button>
      </div>
    </aside>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/chicken.js"></script>
</body>
</html>
